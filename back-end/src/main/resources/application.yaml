spring:
  application:
    name: back-end
  datasource:
    url: jdbc:postgresql://localhost:5433/banco_atividade_aws
    username: postgres
    password: postgres
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate

server:
  servlet:
    context-path: /api

api:
  security:
    jwt:
      secret: chave-secreta

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true